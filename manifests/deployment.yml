apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-cd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-cd-app
  template:
    metadata:
      labels:
        app: flux-cd-app
    spec:
      containers:
        - name: website
          image: saicowdary9/flux-cd:10 # {"$imagepolicy": "flux-system:flux-cd-policy"}
          ports:
            - containerPort: 80
